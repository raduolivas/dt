# Local stand-in for the staging load balancer (infra/aws/staging/alb.tf): one public origin on port 8080, with
# /v1/tracking/snapshot and /v1/tracking/stream* going to tracking and everything else to the gateway, so the
# hosted page and the SDK reach the whole viewer API through one base URL, as they do on staging.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_tokens off;
    # Docker's DNS, re-resolved so a restarted service is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;
    set $tracking http://tracking:8082;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # streams (WebSocket, SSE) pass through unbuffered; the ALB's idle timeout is 120 s, tracking pings every 25 s
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 2m;

    location = /v1/tracking/snapshot {
        proxy_pass $tracking;
    }
    location ^~ /v1/tracking/stream {
        proxy_pass $tracking;
    }
    location / {
        proxy_pass $gateway;
    }
}
