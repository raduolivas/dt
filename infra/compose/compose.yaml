# Local development stack. Ports bind to 127.0.0.1 only.
name: dt

x-service: &service
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: dt
      POSTGRES_USER: dt_admin
      POSTGRES_PASSWORD: dt_admin
    volumes:
      # Mounting the whole directory also replaces the image's own 10_postgis.sh.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dt_admin -d dt"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:6379:6379"

  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  gateway:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    build:
      context: ../../backend
      args:
        SERVICE: gateway
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://svc_gateway:svc_gateway@postgres:5432/dt?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
      # Dev-only placeholder, never a real secret: the same value as accounts'.
      APIKEY_PEPPER: "ZGV2LW9ubHktbm90LWEtc2VjcmV0LXBlcHBlci0wMDAwMDAwMDAwMDA=" # gitleaks:allow (dev-only placeholder)
      # CIDRs of proxies whose X-Forwarded-For hops count; empty: none.
      TRUSTED_PROXIES: ""
    ports:
      - "127.0.0.1:8080:8080"

  deliveries:
    <<: *service
    build:
      context: ../../backend
      args:
        SERVICE: deliveries
    environment:
      PORT: "8081"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://svc_deliveries:svc_deliveries@postgres:5432/dt?sslmode=disable"
    ports:
      - "127.0.0.1:8081:8081"

  tracking:
    <<: *service
    build:
      context: ../../backend
      args:
        SERVICE: tracking
    environment:
      PORT: "8082"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://svc_tracking:svc_tracking@postgres:5432/dt?sslmode=disable"
    ports:
      - "127.0.0.1:8082:8082"

  webhooks:
    <<: *service
    build:
      context: ../../backend
      args:
        SERVICE: webhooks
    environment:
      PORT: "8083"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://svc_webhooks:svc_webhooks@postgres:5432/dt?sslmode=disable"
    ports:
      - "127.0.0.1:8083:8083"

  accounts:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    build:
      context: ../../backend
      args:
        SERVICE: accounts
    environment:
      PORT: "8084"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://svc_accounts:svc_accounts@postgres:5432/dt?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      # Dev-only placeholders, never real secrets. APIKEY_PEPPER is base64 of
      # "dev-only-not-a-secret-pepper-000000000000" and must match the gateway's.
      APIKEY_PEPPER: "ZGV2LW9ubHktbm90LWEtc2VjcmV0LXBlcHBlci0wMDAwMDAwMDAwMDA=" # gitleaks:allow (dev-only placeholder)
      INTERNAL_RPC_TOKEN: "dev-only-not-a-secret-internal-token-0000"
    ports:
      - "127.0.0.1:8084:8084"

volumes:
  nats-data:
