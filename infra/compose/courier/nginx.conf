# Local courier page (courier.<domain> on staging): serves build/courier (make web-assets) on port 8092, so a link
# from the gateway (COURIER_URL_BASE http://courier.localhost:8092) opens http://courier.localhost:8092/s/<code>.
# /s/* and / are the shell (index.html); hashed files live under /assets/.
# The CSP is also sent as a header here because a meta tag cannot carry frame-ancestors. Its connect-src is the API
# origin the page was built for (VITE_DT_API, http://localhost:8080 in make web-assets).
server {
    listen 8092;
    root /srv/courier;
    server_tokens off;

    types {
        text/html html;
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
    }
    default_type application/octet-stream;

    add_header Content-Security-Policy "default-src 'self'; connect-src http://localhost:8080; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /assets/ {
        # nginx drops inherited add_header lines when a location sets its own, so the security headers repeat here
        add_header Content-Security-Policy "default-src 'self'; connect-src http://localhost:8080; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Content-Security-Policy "default-src 'self'; connect-src http://localhost:8080; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
