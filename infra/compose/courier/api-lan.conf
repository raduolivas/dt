# The courier API over HTTPS for the owner's phone on the LAN (port 8444; see nginx-lan.conf.tmpl). Only /v1/courier/
# is forwarded, through the edge proxy to the gateway; nothing of the partner API is reachable from the LAN.
server {
    listen 8444 ssl;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $edge http://edge:8080;

    ssl_certificate /etc/nginx/lan/server.pem;
    ssl_certificate_key /etc/nginx/lan/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location ^~ /v1/courier/ {
        proxy_pass $edge;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        return 404;
    }
}
