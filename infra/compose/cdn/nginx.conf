# Local stand-in for the CDN (S3 + CloudFront at cdn.<domain>): serves build/cdn (make web-assets) on port 8090.
#   page/<sha>/        the hosted tracking page (dev build at page/dev/)
#   sdk/tracking/<v>/  the SDK bundles (dev build at sdk/tracking/dev/)
#   tiles/             the map tiles (the Amsterdam z14 test fixture)
# Any origin may read everything (the page, the SDK on partner sites and the map fetch cross-origin); PMTiles reads
# the archive with range requests, which nginx serves for static files.
server {
    listen 8090;
    root /srv/cdn;
    server_tokens off;
    etag on;

    types {
        application/javascript js mjs;
        text/css css;
        application/json json map;
        application/vnd.pmtiles pmtiles;
    }
    default_type application/octet-stream;

    # Range is safelisted only for a single simple range; allow it (and the conditional headers) explicitly.
    set $cors_headers "Range, If-Match, If-None-Match, If-Modified-Since";
    set $cors_expose "Content-Range, Content-Length, Accept-Ranges, ETag";

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers $cors_expose always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    # Page and SDK files never change once published under a version path.
    location ~ ^/(page|sdk)/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers $cors_expose always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
