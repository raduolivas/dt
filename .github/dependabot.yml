version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /backend/pkg
      - /backend/gen
      - /backend/services/*
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; bump the major by hand
      # together with typescript-eslint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every github/codeql-action step in a workflow must run the same version,
      # so init and analyze are bumped together in one PR.
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
