openapi: 3.1.0
info:
  title: DT API
  version: 1.0.0
  description: |-
    Public API for DT live delivery tracking. See the docs for guides.

    ## Realtime tracking streams

    Besides `GET /tracking/snapshot`, a customer's client can stream snapshots over a
    WebSocket at `/tracking/stream` or, where WebSockets are blocked, over Server-Sent
    Events at `GET /tracking/stream/sse` (send `Authorization: Bearer <viewer_token>`; use
    `fetch`, not `EventSource`). These are not OpenAPI operations.

    - **WebSocket auth.** The first client message must be `{"type":"auth","token":"<viewer_token>"}`.
      The token is never sent in the URL. A viewer token allows 5 concurrent streams.
    - **Server messages**, each a JSON object with a `type`:
      - `snapshot`: `{"type":"snapshot","snapshot":<TrackingSnapshot>}`. Ignore any whose `version` is not greater than the last applied.
      - `status`: `{"type":"status","status":"<delivery status>","at":"<time>"}` when the delivery status changes.
      - `ping`: a keep-alive, every 20 seconds.
      - `revoked`: the tracking link was rotated or has expired. The server then closes the stream (WebSocket close code 4401); do not reconnect with the same token.
    - **Renewing.** The viewer token lasts 15 minutes; call `POST /tracking/session/refresh` before it expires. An open stream stays open past the token's expiry unless the link is revoked.

    ## Error codes added for tracking

    `link_invalid` (401), `viewer_token_invalid` (401), `simulation_state` (409) and
    `tracking_unavailable` (503), documented on the operations where they apply.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  # Placeholder until the product domain is chosen (OPEN_QUESTIONS OQ14).
  - url: https://api.example.invalid/v1
tags:
  - name: Account
    description: The credential a request authenticates with.
  - name: Deliveries
    description: Create deliveries, report their progress and read them back.
  - name: Couriers
    description: Couriers you register for assignment, and the locations you relay for them.
  - name: Tracking
    description: Tracking links, the customer's viewer session, and the courier data partners can read.
  - name: Sandbox
    description: Test-mode helpers. They refuse live keys.
paths:
  /me:
    get:
      operationId: getMe
      summary: Get the authenticated credential
      description: >-
        Returns the tenant, environment and scopes of the secret key the request
        authenticates with. Use it to check that a key works.
      tags: [Account]
      security:
        - SecretKey: []
      responses:
        '200':
          description: The credential the request authenticated with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /deliveries:
    post:
      operationId: createDelivery
      summary: Create a delivery
      description: 'Creates a delivery in `confirmed` status. `external_id` is unique per tenant and environment.
        Requires scope `deliveries:write`. Problem codes: `validation_failed` (400), `external_id_conflict`
        (409, the external id is already used by another delivery), `model_not_allowed` (422, the tenant
        does not allow the requested model). The response carries the customer''s tracking link in `tracking`;
        it is `null` if issuing the link failed, in which case call `rotateTrackingLink`.'
      tags:
      - Deliveries
      security:
      - SecretKey: []
      parameters:
      - &id008
        $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryRequest'
            examples:
              minimal:
                summary: Minimal
                value:
                  external_id: order-1042
                  pickup:
                    location:
                      lat: -23.5614
                      lng: -46.6559
                    name: Pizzaria Central
                  dropoff:
                    location:
                      lat: -23.5505
                      lng: -46.6333
              full:
                summary: All fields
                value:
                  external_id: order-1042
                  delivery_model: direct
                  pickup:
                    location:
                      lat: -23.5614
                      lng: -46.6559
                    name: Pizzaria Central
                  dropoff:
                    location:
                      lat: -23.5505
                      lng: -46.6333
                    label: Apto 42
                  customer:
                    first_name: Ana
                  items_summary: 2 pizzas
                  item_count: 2
                  notes: Ring twice
                  metadata:
                    table: '12'
                  ready_at: '2026-10-22T14:15:00Z'
      responses:
        '201':
          description: The created delivery, with its tracking link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeliveryResponse'
              examples:
                default:
                  value:
                    id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                    external_id: order-1042
                    environment: test
                    delivery_model: direct
                    status: confirmed
                    pickup:
                      location:
                        lat: -23.5614
                        lng: -46.6559
                      name: Pizzaria Central
                    dropoff:
                      location:
                        lat: -23.5505
                        lng: -46.6333
                      label: Apto 42
                    customer:
                      first_name: Ana
                    items_summary: 2 pizzas
                    item_count: 2
                    notes: Ring twice
                    metadata:
                      table: '12'
                    courier: null
                    pickup_policy: any
                    pickup_confirmations: []
                    personal_data_erased: false
                    created_at: '2026-10-22T14:00:00Z'
                    updated_at: '2026-10-22T14:00:00Z'
                    ready_at: null
                    tracking:
                      url: https://track.example.invalid/t/Xk3m9QpL2vN7aB4cD8eF1g
                      token: Xk3m9QpL2vN7aB4cD8eF1g
                      expires_at: null
        '400': &id002
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: '`external_id_conflict`: a delivery with this `external_id` already exists, or the
            Idempotency-Key was reused with a different request or is still in progress.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '`model_not_allowed`: the tenant does not allow this `delivery_model`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id003
          $ref: '#/components/responses/Unauthenticated'
        '403': &id004
          $ref: '#/components/responses/Forbidden'
        '429': &id005
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listDeliveries
      summary: List deliveries
      description: Lists deliveries newest first by id. Page with `starting_after`. Requires scope `deliveries:read`.
      tags:
      - Deliveries
      security:
      - SecretKey: []
      parameters:
      - $ref: '#/components/parameters/DeliveryStatusFilter'
      - $ref: '#/components/parameters/DeliveryModelFilter'
      - $ref: '#/components/parameters/CreatedGte'
      - $ref: '#/components/parameters/CreatedLt'
      - $ref: '#/components/parameters/ExternalIdFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryList'
              examples:
                default:
                  value:
                    data:
                    - &id001
                      id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                      external_id: order-1042
                      environment: test
                      delivery_model: direct
                      status: confirmed
                      pickup:
                        location:
                          lat: -23.5614
                          lng: -46.6559
                        name: Pizzaria Central
                      dropoff:
                        location:
                          lat: -23.5505
                          lng: -46.6333
                        label: Apto 42
                      customer:
                        first_name: Ana
                      items_summary: 2 pizzas
                      item_count: 2
                      notes: Ring twice
                      metadata:
                        table: '12'
                      courier: null
                      pickup_policy: any
                      pickup_confirmations: []
                      personal_data_erased: false
                      created_at: '2026-10-22T14:00:00Z'
                      updated_at: '2026-10-22T14:00:00Z'
                      ready_at: null
                    has_more: false
        '400': *id002
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}:
    parameters:
    - &id007
      name: id
      in: path
      required: true
      description: The delivery id.
      schema:
        type: string
        pattern: ^del_[0-9a-z]{26}$
      example: del_01j9z3k8m2q4r6s8t0v2w4x6y8
    get:
      operationId: getDelivery
      summary: Get a delivery
      description: Requires scope `deliveries:read`. A delivery of another tenant or environment is `404
        not_found`.
      tags:
      - Deliveries
      security:
      - SecretKey: []
      responses:
        '200':
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              examples:
                default:
                  value: *id001
        '404': &id006
          $ref: '#/components/responses/NotFound'
        '401': *id003
        '403': *id004
        '429': *id005
    patch:
      operationId: updateDelivery
      summary: Update a delivery
      description: 'Changes the dropoff location, dropoff label, notes, metadata or ready time. Send `null` to clear
        `dropoff_label`, `notes` or `ready_at` (the dropoff location cannot be cleared); a `metadata` value replaces
        the whole map and `null` clears it. Requires scope `deliveries:write`. Problem codes: `validation_failed`
        (400), `not_found` (404), `dropoff_locked` (409, the delivery is past pickup or final, so the dropoff
        location cannot change).'
      tags:
      - Deliveries
      security:
      - SecretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryRequest'
            examples:
              move_dropoff:
                summary: Move the dropoff
                value:
                  dropoff:
                    location:
                      lat: -23.55
                      lng: -46.64
              move_ready_at:
                summary: The kitchen needs 10 more minutes
                value:
                  ready_at: '2026-10-22T14:25:00Z'
              clear_notes:
                summary: Clear notes and label
                value:
                  notes: null
                  dropoff_label: null
      responses:
        '200':
          description: The updated delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              examples:
                default:
                  value: *id001
        '400': *id002
        '404': *id006
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          description: '`dropoff_locked`: the dropoff location can no longer change.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/assignment:
    parameters:
    - *id007
    post:
      operationId: assignCourier
      summary: Assign a courier
      description: 'Assigns an upserted courier to the delivery. Requires scope `deliveries:write`. Problem
        codes: `validation_failed` (400), `not_found` (404), `courier_not_found` (422, no such courier in
        this tenant and environment), `invalid_transition` (409, the delivery is final).'
      tags:
      - Deliveries
      security:
      - SecretKey: []
      parameters:
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCourierRequest'
            examples:
              default:
                value:
                  courier_id: cou_01j9z3k8m2q4r6s8t0v2w4x6y8
      responses:
        '200':
          description: The delivery with the courier assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              examples:
                default:
                  value:
                    id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                    external_id: order-1042
                    environment: test
                    delivery_model: direct
                    status: courier_assigned
                    pickup:
                      location:
                        lat: -23.5614
                        lng: -46.6559
                      name: Pizzaria Central
                    dropoff:
                      location:
                        lat: -23.5505
                        lng: -46.6333
                      label: Apto 42
                    customer:
                      first_name: Ana
                    items_summary: 2 pizzas
                    item_count: 2
                    notes: Ring twice
                    metadata:
                      table: '12'
                    courier:
                      id: cou_01j9z3k8m2q4r6s8t0v2w4x6y8
                      external_id: driver-77
                      display_name: Carlos
                      vehicle: e_bike
                    pickup_policy: any
                    pickup_confirmations: []
                    personal_data_erased: false
                    created_at: '2026-10-22T14:00:00Z'
                    updated_at: '2026-10-22T14:00:00Z'
                    ready_at: null
        '400': *id002
        '404': *id006
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          description: '`invalid_transition`: the delivery cannot take a courier in its current status,
            or the Idempotency-Key was reused with a different request or is still in progress.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`courier_not_found`: no courier with this id exists for the tenant and environment.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/events:
    parameters:
    - *id007
    post:
      operationId: reportDeliveryEvent
      summary: Report a delivery event
      description: 'Reports a progress event for a delivery. `event_id` makes the report idempotent. `outcome`
        says what happened: `applied` (state changed), `duplicate` (this `event_id` was seen), `stale` (older
        than the current state; ignored), `conflict` (contradicts a conflicting report within 60 seconds),
        `recorded` (stored without a state change, for example one confirmation toward a multi-party pickup
        policy). `occurred_at` may be at most 5 minutes after receipt; when absent it is the receipt time.
        Requires scope `deliveries:write`. Problem codes: `validation_failed` (400), `not_found` (404),
        `invalid_transition` (409).'
      tags:
      - Deliveries
      security:
      - SecretKey: []
      parameters:
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDeliveryEventRequest'
            examples:
              at_pickup:
                summary: Courier at the pickup
                value:
                  event_id: evt-9001
                  type: at_pickup
                  occurred_at: '2026-10-22T14:10:00Z'
              pickup_confirmed:
                summary: Store confirms the pickup
                value:
                  event_id: evt-9002
                  type: pickup_confirmed
                  by: store
              failed:
                summary: Delivery failed
                value:
                  event_id: evt-9003
                  type: failed
                  reason: Customer not reachable
      responses:
        '200':
          description: The outcome of the report and the delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEventResult'
              examples:
                default:
                  value:
                    outcome: applied
                    delivery:
                      id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                      external_id: order-1042
                      environment: test
                      delivery_model: direct
                      status: at_pickup
                      pickup:
                        location:
                          lat: -23.5614
                          lng: -46.6559
                        name: Pizzaria Central
                      dropoff:
                        location:
                          lat: -23.5505
                          lng: -46.6333
                        label: Apto 42
                      customer:
                        first_name: Ana
                      items_summary: 2 pizzas
                      item_count: 2
                      notes: Ring twice
                      metadata:
                        table: '12'
                      courier:
                        id: cou_01j9z3k8m2q4r6s8t0v2w4x6y8
                        external_id: driver-77
                        display_name: Carlos
                        vehicle: e_bike
                      pickup_policy: any
                      pickup_confirmations: []
                      personal_data_erased: false
                      created_at: '2026-10-22T14:00:00Z'
                      updated_at: '2026-10-22T14:10:00Z'
                      ready_at: null
        '400': *id002
        '404': *id006
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          description: '`invalid_transition`: the event is not allowed in the delivery''s current status,
            or the Idempotency-Key was reused with a different request or is still in progress.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/cancel:
    parameters:
    - *id007
    post:
      operationId: cancelDelivery
      summary: Cancel a delivery
      description: 'Cancels a delivery that is not yet final. Requires scope `deliveries:write`. Problem
        codes: `not_found` (404), `invalid_transition` (409, the delivery is already final).'
      tags:
      - Deliveries
      security:
      - SecretKey: []
      parameters:
      - *id008
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDeliveryRequest'
            examples:
              with_reason:
                summary: With a reason
                value:
                  reason: Customer cancelled the order
              empty:
                summary: No reason
                value: {}
      responses:
        '200':
          description: The cancelled delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              examples:
                default:
                  value:
                    id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                    external_id: order-1042
                    environment: test
                    delivery_model: direct
                    status: cancelled
                    pickup:
                      location:
                        lat: -23.5614
                        lng: -46.6559
                      name: Pizzaria Central
                    dropoff:
                      location:
                        lat: -23.5505
                        lng: -46.6333
                      label: Apto 42
                    customer:
                      first_name: Ana
                    items_summary: 2 pizzas
                    item_count: 2
                    notes: Ring twice
                    metadata:
                      table: '12'
                    courier: null
                    pickup_policy: any
                    pickup_confirmations: []
                    personal_data_erased: false
                    created_at: '2026-10-22T14:00:00Z'
                    updated_at: '2026-10-22T14:05:00Z'
                    ready_at: null
        '400': *id002
        '404': *id006
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          description: '`invalid_transition`: the delivery is already final, or the Idempotency-Key was
            reused with a different request or is still in progress.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/personal-data:
    parameters:
    - *id007
    delete:
      operationId: erasePersonalData
      summary: Erase a delivery's personal data
      description: 'Irreversibly clears the customer first name, notes, dropoff label and metadata. Allowed
        only once the delivery is final. Requires scope `deliveries:write`. Problem codes: `not_found` (404),
        `delivery_active` (409, the delivery is not final yet).'
      tags:
      - Deliveries
      security:
      - SecretKey: []
      responses:
        '200':
          description: The delivery with its personal data erased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              examples:
                default:
                  value:
                    id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                    external_id: order-1042
                    environment: test
                    delivery_model: direct
                    status: delivered
                    pickup:
                      location:
                        lat: -23.5614
                        lng: -46.6559
                      name: Pizzaria Central
                    dropoff:
                      location:
                        lat: -23.5505
                        lng: -46.6333
                      label: null
                    customer:
                      first_name: null
                    items_summary: 2 pizzas
                    item_count: 2
                    notes: null
                    metadata: {}
                    courier: null
                    pickup_policy: any
                    pickup_confirmations: []
                    personal_data_erased: true
                    created_at: '2026-10-22T14:00:00Z'
                    updated_at: '2026-10-22T14:00:00Z'
                    ready_at: null
        '404': *id006
        '409':
          description: '`delivery_active`: the delivery is not final yet.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': *id003
        '403': *id004
        '429': *id005
  /couriers/{external_id}:
    put:
      operationId: upsertCourier
      summary: Create or update a courier
      description: Creates the courier, or updates it when `external_id` already exists. Returns 201 when
        created and 200 when updated. Requires scope `couriers:write`.
      tags:
      - Couriers
      security:
      - SecretKey: []
      parameters:
      - name: external_id
        in: path
        required: true
        description: Your id for the courier (1 to 255 printable ASCII characters).
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[ -~]+$
        example: driver-77
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCourierRequest'
            examples:
              default:
                value:
                  display_name: Carlos
                  vehicle: e_bike
                  photo_url: https://cdn.example.com/c/77.jpg
      responses:
        '200':
          description: The courier was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
              examples:
                default:
                  value: &id009
                    id: cou_01j9z3k8m2q4r6s8t0v2w4x6y8
                    external_id: driver-77
                    display_name: Carlos
                    vehicle: e_bike
                    photo_url: https://cdn.example.com/c/77.jpg
                    created_at: '2026-10-22T13:00:00Z'
                    updated_at: '2026-10-22T13:00:00Z'
        '201':
          description: The courier was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
              examples:
                default:
                  value: *id009
        '400': *id002
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/tracking-link/rotate:
    parameters:
    - *id007
    post:
      operationId: rotateTrackingLink
      summary: Rotate the tracking link
      description: 'Invalidates the delivery''s current tracking link at once and returns a new one. Viewers
        already connected through the old link are disconnected within a second. When the delivery has no
        link (for example because issuing it failed at creation) a link is issued. Requires scope `deliveries:write`.
        Problem codes: `not_found` (404).'
      tags:
      - Tracking
      security:
      - SecretKey: []
      parameters:
      - *id008
      responses:
        '200':
          description: The new tracking link. `expires_at` is `null` until the delivery is final, then 30 minutes
            after it ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingLink'
              examples:
                default:
                  value:
                    url: https://track.example.invalid/t/Zr7wT2nKd9sH4yJ6uB3xQa
                    token: Zr7wT2nKd9sH4yJ6uB3xQa
                    expires_at: null
        '404': *id006
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/tracking:
    parameters:
    - *id007
    get:
      operationId: getDeliveryTracking
      summary: Get the live tracking view
      description: 'The live view of a delivery without the visibility filter the customer''s viewer applies:
        the courier''s position, heading, speed and signal are always included once a courier is assigned,
        whatever the delivery model and status. Available in every state; after a final state it returns
        the last values. Requires scope `deliveries:read`. Problem codes: `not_found` (404), `tracking_unavailable`
        (503).'
      tags:
      - Tracking
      security:
      - SecretKey: []
      responses:
        '200':
          description: The live view.
