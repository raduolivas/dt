                        location:
                          lat: -23.5505
                          lng: -46.6333
                        label: Apto 42
                      route:
                        to_pickup: null
                        to_dropoff:
                        - [-23.5561, -46.6492]
                        - [-23.5530, -46.6410]
                        - [-23.5505, -46.6333]
                      eta_seconds: 420
                      eta_window: null
                      eta_state: live
                      eta_quality: osrm
                      distance_remaining_m: 1350
                      progress: 0.42
                      timeline:
                      - status: confirmed
                        at: '2026-10-22T14:00:00Z'
                      - status: picked_up
                        at: '2026-10-22T14:15:00Z'
                      updated_at: '2026-10-22T14:20:03.410Z'
                      version: 37
                    branding: null
                preparing:
                  summary: Before pickup in the Direct model (courier hidden, window shown)
                  value:
                    viewer_token: eyJhbGciOiJFZERTQSIsImtpZCI6InYxIn0.eyJhdWQiOiJ2aWV3ZXIifQ.c2lnbmF0dXJl
                    expires_at: '2026-10-22T14:35:00Z'
                    snapshot:
                      delivery_id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                      delivery_model: direct
