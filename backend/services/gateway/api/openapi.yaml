              examples:
                default:
                  value: *id011
        '401': *id012
        '429': *id005
        '503': *id010
webhooks: {}
components:
  securitySchemes:
    SecretKey:
      type: http
      scheme: bearer
      description: Partner secret API key (`dt_sk_test_…` / `dt_sk_live_…`). Server-to-server only.
    ViewerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived viewer token from `POST /tracking/session`. Safe to use in the customer's browser.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-chosen key that makes a POST safe to retry (1 to 255 printable
        ASCII characters). A retry with the same key and body replays the first
        response for 24 hours; a different body is refused.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[ -~]+$'
    DeliveryStatusFilter:
      name: status
      in: query
      description: Only deliveries in this status.
      schema:
        $ref: '#/components/schemas/DeliveryStatus'
    DeliveryModelFilter:
      name: delivery_model
      in: query
      description: Only deliveries of this model.
      schema:
        $ref: '#/components/schemas/DeliveryModel'
    CreatedGte:
      name: created_gte
      in: query
      description: Only deliveries created at or after this time.
      schema:
        type: string
        format: date-time
    CreatedLt:
      name: created_lt
      in: query
      description: Only deliveries created before this time.
      schema:
        type: string
        format: date-time
    ExternalIdFilter:
      name: external_id
      in: query
      description: Only the delivery with this external id.
      schema:
        $ref: '#/components/schemas/ExternalId'
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StartingAfter:
      name: starting_after
      in: query
      description: Return deliveries after this id (the last id of the previous page).
      schema:
        $ref: '#/components/schemas/DeliveryId'
  responses:
    Unauthenticated:
      description: >-
        The credential is missing, malformed, unknown, expired or revoked, or was
        sent other than as a bearer token (`unauthenticated`).
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The credential is valid but may not make this request
        (`secret_key_in_browser`, `ip_not_allowed`, `insufficient_scope`,
        `environment_not_allowed` or `cors_not_allowed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: The rate limit was exceeded (`rate_limited`). Retry after `Retry-After` seconds.
      headers:
        RateLimit-Limit:
          description: Requests allowed in the current window.
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the window resets.
          schema:
            type: integer
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The request body is larger than 64 KiB (`payload_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist for this tenant and environment (`not_found`). Resources of
        other tenants or environments are never revealed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ViewerTokenInvalid:
      description: The viewer token is missing, malformed, expired, or its tracking link was rotated or has
        expired (`viewer_token_invalid`). Start a new session with the link token.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrackingUnavailable:
      description: The tracking service cannot be reached right now (`tracking_unavailable`). Retry shortly.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request is invalid (`validation_failed`); `errors` lists each failing field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Environment:
      type: string
      description: Test and live data are fully separate.
      enum: [test, live]
    Scope:
      type: string
      description: A permission a secret key carries.
      enum: ['deliveries:read', 'deliveries:write', 'couriers:write', 'webhooks:write']
    Me:
      type: object
      description: The credential a request authenticated with.
      required: [tenant_id, environment, credential, scopes]
      properties:
        tenant_id:
          type: string
          pattern: '^ten_[0-9a-z]{26}$'
          examples: [ten_01j9z3k8m2q4r6s8t0v2w4x6y8]
        environment:
          $ref: '#/components/schemas/Environment'
        credential:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [secret_key]
            id:
              type: string
              pattern: '^ak_[0-9a-z]{26}$'
              examples: [ak_01j9z3k8m2q4r6s8t0v2w4x6y8]
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Scope'
    LatLng:
      type: object
      description: WGS84 coordinate.
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    DeliveryModel:
      type: string
      description: '`direct`: the partner reports progress. `end_to_end`: DT couriers report it.'
      enum:
      - direct
      - end_to_end
    DeliveryStatus:
      type: string
      description: '`delivered`, `cancelled` and `failed` are final.'
      enum:
      - confirmed
      - courier_assigned
      - at_pickup
      - picked_up
      - arriving
      - delivered
      - cancelled
      - failed
    PickupPolicy:
      type: string
      description: Who must confirm the pickup. A delivery keeps the policy it was created with.
      enum:
      - any
      - courier
      - store
      - courier_and_store
    Vehicle:
      type: string
      enum:
      - bicycle
      - e_bike
      - scooter
      - car
      - on_foot
    DeliveryEventType:
      type: string
      enum:
      - at_pickup
      - pickup_confirmed
      - arriving
      - delivered
      - failed
    DeliveryEventOutcome:
      type: string
      enum:
      - applied
      - duplicate
      - stale
      - conflict
      - recorded
    DeliveryId:
      type: string
      pattern: ^del_[0-9a-z]{26}$
      examples:
      - del_01j9z3k8m2q4r6s8t0v2w4x6y8
    CourierId:
      type: string
      pattern: ^cou_[0-9a-z]{26}$
      examples:
      - cou_01j9z3k8m2q4r6s8t0v2w4x6y8
    ExternalId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[ -~]+$
      description: Your identifier (1 to 255 printable ASCII characters).
      examples:
      - order-1042
    Metadata:
      type: object
      description: Up to 50 string key/value pairs. Keys are 1 to 40 characters of `a-zA-Z0-9_`; values are
        at most 500 characters.
      maxProperties: 50
      propertyNames: &id001
        type: string
        minLength: 1
        maxLength: 40
        pattern: ^[a-zA-Z0-9_]+$
      additionalProperties: &id002
        type: string
        maxLength: 500
      examples: &id003
      - table: '12'
    Pickup:
      type: object
      required:
      - location
      - name
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/LatLng'
        name:
          type: string
          maxLength: 100
    Dropoff:
      type: object
      required:
      - location
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/LatLng'
        label:
          type: string
          maxLength: 100
    Customer:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
          maxLength: 50
    CreateDeliveryRequest:
      type: object
      description: Pickup and dropoff must be at most 100 km apart.
      additionalProperties: false
      required:
      - external_id
      - pickup
      - dropoff
      properties:
        external_id:
          $ref: '#/components/schemas/ExternalId'
        delivery_model:
          $ref: '#/components/schemas/DeliveryModel'
        pickup:
          $ref: '#/components/schemas/Pickup'
        dropoff:
          $ref: '#/components/schemas/Dropoff'
        customer:
          $ref: '#/components/schemas/Customer'
        items_summary:
          type: string
          maxLength: 200
        item_count:
          type: integer
          minimum: 0
          maximum: 999
        notes:
          type: string
          maxLength: 500
        metadata:
          $ref: '#/components/schemas/Metadata'
        ready_at:
          type: string
          format: date-time
          description: When the order will be ready for pickup. Between 1 hour before and 24 hours after
            now. Drives the ETA before pickup; without it the tenant's default preparation time applies.
    UpdateDeliveryRequest:
      type: object
      description: Only the fields sent change. `null` clears `dropoff_label`, `notes`, `metadata` and `ready_at`; the
        dropoff location cannot be cleared.
      additionalProperties: false
      minProperties: 1
      properties:
        dropoff:
          type: object
          required:
          - location
          additionalProperties: false
          properties:
            location:
              $ref: '#/components/schemas/LatLng'
        dropoff_label:
          type:
          - string
          - 'null'
          maxLength: 100
        ready_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the order will be ready for pickup (between 1 hour before and 24 hours after now);
            `null` clears it. Changeable until pickup.
        notes:
          type:
          - string
          - 'null'
          maxLength: 500
        metadata:
          type:
          - object
          - 'null'
          description: Up to 50 string key/value pairs. Keys are 1 to 40 characters of `a-zA-Z0-9_`; values
            are at most 500 characters.
          maxProperties: 50
          propertyNames: *id001
          additionalProperties: *id002
          examples: *id003
    AssignCourierRequest:
      type: object
      additionalProperties: false
      required:
      - courier_id
      properties:
        courier_id:
          $ref: '#/components/schemas/CourierId'
    ReportDeliveryEventRequest:
      type: object
      additionalProperties: false
      required:
      - event_id
      - type
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[ -~]+$
          description: Your id for this report; a repeat is reported as `duplicate`.
        type:
          $ref: '#/components/schemas/DeliveryEventType'
        occurred_at:
          type: string
          format: date-time
          description: When it happened. At most 5 minutes after receipt; defaults to receipt time.
        by:
          type: string
          enum:
          - partner
          - store
          description: Who confirms. Only meaningful for `pickup_confirmed`; defaults to `partner`.
        reason:
          type: string
          maxLength: 200
          description: Why. Stored encrypted and erased with the delivery's personal data; never included in events.
    CancelDeliveryRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: Why. Stored encrypted and erased with the delivery's personal data; never included in events.
    UpsertCourierRequest:
      type: object
      additionalProperties: false
      required:
      - display_name
      - vehicle
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        photo_url:
          type: string
          maxLength: 2048
          pattern: ^https://[^\s]+$
          format: uri
    CourierRef:
      type: object
      required:
      - id
      - external_id
      - display_name
      - vehicle
      properties:
        id:
          $ref: '#/components/schemas/CourierId'
        external_id:
          $ref: '#/components/schemas/ExternalId'
        display_name:
          type: string
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Courier:
      type: object
      required:
      - id
      - external_id
      - display_name
      - vehicle
      - photo_url
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/CourierId'
        external_id:
          $ref: '#/components/schemas/ExternalId'
        display_name:
          type: string
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        photo_url:
          type:
          - string
          - 'null'
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PickupConfirmation:
      type: object
      required:
      - by
      - at
      properties:
        by:
          type: string
          enum:
          - courier
          - store
          - partner
        at:
          type: string
          format: date-time
    Delivery:
      type: object
      required:
      - id
      - external_id
      - environment
      - delivery_model
      - status
      - pickup
      - dropoff
      - customer
      - items_summary
      - item_count
      - notes
      - metadata
      - courier
      - pickup_policy
      - pickup_confirmations
      - personal_data_erased
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/DeliveryId'
        external_id:
          $ref: '#/components/schemas/ExternalId'
        environment:
          $ref: '#/components/schemas/Environment'
        delivery_model:
          $ref: '#/components/schemas/DeliveryModel'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        pickup:
          type: object
          required:
          - location
          - name
          properties:
            location:
              $ref: '#/components/schemas/LatLng'
            name:
              type: string
        dropoff:
          type: object
          required:
          - location
          - label
          properties:
            location:
              $ref: '#/components/schemas/LatLng'
            label:
              type:
              - string
              - 'null'
        customer:
          type: object
          required:
          - first_name
          properties:
            first_name:
              type:
              - string
              - 'null'
        items_summary:
          type:
          - string
          - 'null'
        item_count:
          type:
          - integer
          - 'null'
        notes:
          type:
          - string
          - 'null'
        metadata:
          type: object
          additionalProperties:
            type: string
        courier:
          oneOf:
          - $ref: '#/components/schemas/CourierRef'
          - type: 'null'
        pickup_policy:
          $ref: '#/components/schemas/PickupPolicy'
        pickup_confirmations:
          type: array
          items:
            $ref: '#/components/schemas/PickupConfirmation'
        personal_data_erased:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ready_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the order is expected to be ready for pickup, if you gave one.
    DeliveryList:
      type: object
      required:
      - data
      - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
        has_more:
          type: boolean
    DeliveryEventResult:
      type: object
      required:
      - outcome
      - delivery
      properties:
        outcome:
          $ref: '#/components/schemas/DeliveryEventOutcome'
        delivery:
          $ref: '#/components/schemas/Delivery'
    TrackingLink:
      type: object
      description: A customer-facing tracking link. Put `url` in an SMS, email or push notification.
      required: [url, token, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: The hosted tracking page for this delivery.
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
          description: The link token; the part of `url` after `/t/`. Treat it like a password for this delivery.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: '`null` until the delivery is final; then 30 minutes after it ended.'
    CreateDeliveryResponse:
      description: The created delivery with its tracking link.
      allOf:
      - $ref: '#/components/schemas/Delivery'
      - type: object
        # Not yet in `required`: the gateway starts issuing links in a later M3 task, which tightens this.
        properties:
          tracking:
            description: '`null` when the link could not be issued; the delivery is still created. Call `rotateTrackingLink`
              to issue one.'
            oneOf:
            - $ref: '#/components/schemas/TrackingLink'
            - type: 'null'
    CourierSignal:
      type: string
      description: >-
        `pending`: the courier is visible but no fix has arrived yet. `live`:
        the last fix is at most 30 seconds old. `stale`: older than 30 seconds.
        `lost`: older than 5 minutes (or still `pending` after 5 minutes).
      enum: [pending, live, stale, lost]
    EtaState:
      type: string
      description: >-
        `calculating`: the ready time is unknown, so there is no ETA yet.
        `estimated`: before pickup, preparation plus drive, shown as `eta_window`.
        `live`: after pickup, the drive time from the courier's position.
      enum: [calculating, estimated, live]
    EtaQuality:
      type: string
      description: '`osrm`: from the routing engine. `estimated`: a fallback (straight-line or last known route) because routing was unavailable or the courier signal is stale.'
      enum: [osrm, estimated]
    EtaWindow:
      type:
      - object
      - 'null'
      description: The expected arrival range in seconds from now. Set before pickup; `null` otherwise.
      required: [min_seconds, max_seconds]
      properties:
        min_seconds:
          type: integer
          minimum: 0
        max_seconds:
          type: integer
          minimum: 0
    LatLngPair:
      type: array
      description: '`[lat, lng]`.'
      minItems: 2
      maxItems: 2
      items:
        type: number
        format: double
    TrackingRoute:
      type: object
      required: [to_pickup, to_dropoff]
      properties:
        to_pickup:
          type:
          - array
          - 'null'
          description: The courier's route to the pickup. `null` in the Direct model and once picked up.
          items:
            $ref: '#/components/schemas/LatLngPair'
        to_dropoff:
          type: array
          items:
            $ref: '#/components/schemas/LatLngPair'
    TrackingTimelineEntry:
      type: object
      required: [status, at]
      properties:
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        at:
          type: string
          format: date-time
    TrackingCourier:
      type: object
      description: The courier as the customer sees them.
      required: [display_name, vehicle, photo_url, position, heading_deg, speed_kmh, position_at, signal]
      properties:
        display_name:
          type: string
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        photo_url:
          type:
          - string
          - 'null'
        position:
          oneOf:
          - $ref: '#/components/schemas/LatLng'
          - type: 'null'
          description: '`null` while `signal` is `pending`.'
        heading_deg:
          type:
          - number
          - 'null'
        speed_kmh:
          type:
          - number
          - 'null'
        position_at:
          type:
          - string
          - 'null'
          format: date-time
        signal:
          $ref: '#/components/schemas/CourierSignal'
    PartnerCourier:
      description: The assigned courier, always with their position and your own ids.
      allOf:
      - $ref: '#/components/schemas/TrackingCourier'
      - type: object
        required: [id, external_id]
        properties:
          id:
            $ref: '#/components/schemas/CourierId'
          external_id:
            $ref: '#/components/schemas/ExternalId'
    TrackingSnapshot:
      type: object
      description: >-
        What the customer's tracking page shows. `courier` is `null` while the
        courier is not visible (End-to-end: from assignment; Direct: from pickup)
        and `route.to_pickup` is `null` in the Direct model. Clients ignore a
        snapshot whose `version` is not greater than the last one applied.
      required:
      - delivery_id
      - delivery_model
      - status
      - courier
      - pickup
      - dropoff
      - route
      - eta_seconds
      - eta_window
      - eta_state
      - eta_quality
      - distance_remaining_m
      - progress
      - timeline
      - updated_at
      - version
      properties:
        delivery_id:
          $ref: '#/components/schemas/DeliveryId'
        delivery_model:
          $ref: '#/components/schemas/DeliveryModel'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        courier:
          oneOf:
          - $ref: '#/components/schemas/TrackingCourier'
          - type: 'null'
        pickup:
          type: object
          required: [location, name]
          properties:
            location:
              $ref: '#/components/schemas/LatLng'
            name:
              type: string
        dropoff:
          type: object
          required: [location, label]
          properties:
            location:
              $ref: '#/components/schemas/LatLng'
            label:
              type:
              - string
              - 'null'
        route:
          $ref: '#/components/schemas/TrackingRoute'
        eta_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Seconds until arrival; the midpoint of `eta_window` before pickup. `null` while `eta_state` is `calculating`.
        eta_window:
          $ref: '#/components/schemas/EtaWindow'
        eta_state:
          $ref: '#/components/schemas/EtaState'
        eta_quality:
          $ref: '#/components/schemas/EtaQuality'
        distance_remaining_m:
          type:
          - number
          - 'null'
          minimum: 0
        progress:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TrackingTimelineEntry'
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Increases monotonically per delivery.
    PartnerView:
      type: object
      description: >-
        The live view for the partner. The same fields as `TrackingSnapshot`,
        but `courier` is `null` only when none is assigned, and carries `id` and
        `external_id`.
      required:
      - delivery_id
      - delivery_model
      - status
      - courier
      - pickup
      - dropoff
      - route
      - eta_seconds
      - eta_window
      - eta_state
      - eta_quality
      - distance_remaining_m
      - progress
      - timeline
      - updated_at
      - version
      properties:
        delivery_id:
          $ref: '#/components/schemas/DeliveryId'
        delivery_model:
          $ref: '#/components/schemas/DeliveryModel'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        courier:
          oneOf:
          - $ref: '#/components/schemas/PartnerCourier'
          - type: 'null'
        pickup:
          type: object
          required: [location, name]
          properties:
            location:
              $ref: '#/components/schemas/LatLng'
            name:
              type: string
        dropoff:
          type: object
          required: [location, label]
          properties:
            location:
              $ref: '#/components/schemas/LatLng'
            label:
              type:
              - string
              - 'null'
        route:
          $ref: '#/components/schemas/TrackingRoute'
        eta_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
        eta_window:
          $ref: '#/components/schemas/EtaWindow'
        eta_state:
          $ref: '#/components/schemas/EtaState'
        eta_quality:
          $ref: '#/components/schemas/EtaQuality'
        distance_remaining_m:
          type:
          - number
          - 'null'
          minimum: 0
        progress:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TrackingTimelineEntry'
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    TrailFix:
      type: object
      required: [t, lat, lng, accuracy_m, speed_mps, heading_deg, source]
      properties:
        t:
          type: string
          format: date-time
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracy_m:
          type: number
          minimum: 0
        speed_mps:
          type:
          - number
          - 'null'
        heading_deg:
          type:
          - number
          - 'null'
        source:
          type: string
          description: Where the fix came from (`relay` or `simulator`).
    TrailPage:
      type: object
      required: [data, has_more, next_cursor, raw_available, simplified]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrailFix'
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `starting_after` for the next page; `null` on the last page.
        raw_available:
          type: boolean
          description: '`false` once the raw fixes were deleted (after 30 days or on erasure).'
        simplified:
          type:
          - array
          - 'null'
          description: The simplified route; set when `raw_available` is `false`.
          items:
            $ref: '#/components/schemas/LatLngPair'
    TrailGeoJson:
      type: object
      description: A GeoJSON FeatureCollection (coordinates are `[lng, lat]`).
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type:
                type: string
                enum: [Feature]
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type:
                    type: string
                    enum: [LineString, Point]
                  coordinates:
                    type: array
              properties:
                type: object
    ProofPoint:
      type: object
      required: [status, at, actor, position, position_at, accuracy_m]
      properties:
        status:
          $ref: '#/components/schemas/DeliveryEventType'
        at:
          type: string
          format: date-time
        actor:
          type: string
          enum: [partner, courier, system]
        position:
          oneOf:
          - $ref: '#/components/schemas/LatLng'
          - type: 'null'
          description: '`null` when no fix was received in the 2 minutes before `at`.'
        position_at:
          type:
          - string
          - 'null'
          format: date-time
        accuracy_m:
          type:
          - number
          - 'null'
          minimum: 0
    ProofPointList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProofPoint'
    CourierFix:
      type: object
      additionalProperties: false
      required: [t, lat, lng, accuracy_m]
      properties:
        t:
          type: string
          format: date-time
          description: When the fix was taken. At most 5 seconds after receipt.
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
          maximum: 10000
        speed_mps:
          type: number
          minimum: 0
          maximum: 100
        heading_deg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
    ReportCourierLocationsRequest:
      type: object
      additionalProperties: false
      required: [fixes]
      properties:
        fixes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CourierFix'
    ReportCourierLocationsResult:
      type: object
      required: [accepted, dropped]
      properties:
        accepted:
          type: integer
          minimum: 0
        dropped:
          type: integer
          minimum: 0
    SimulateDeliveryRequest:
      type: object
      additionalProperties: false
      properties:
        speed_factor:
          type: number
          minimum: 1
          maximum: 20
          default: 1
          description: How many times faster than real time the courier drives.
        signal_gap:
          type: object
          additionalProperties: false
          description: Stop sending fixes for a while, to test the stale and lost states.
          required: [after_s, duration_s]
          properties:
            after_s:
              type: integer
              minimum: 0
              maximum: 3600
              description: Seconds of simulated time after the start.
            duration_s:
              type: integer
              minimum: 0
              maximum: 3600
    SimulationStarted:
      type: object
      required: [simulation_id]
      properties:
        simulation_id:
          type: string
          pattern: ^sim_[0-9a-z]{26}$
    CreateTrackingSessionRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{22}$
          description: The tracking link token.
    TrackingSession:
      type: object
      required: [viewer_token, expires_at, snapshot, branding]
      properties:
        viewer_token:
          type: string
          description: A short-lived bearer token for the snapshot and stream endpoints.
        expires_at:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/TrackingSnapshot'
        branding:
          type: 'null'
          description: Always `null` for now.
    ViewerTokenRefresh:
      type: object
      required: [viewer_token, expires_at]
      properties:
        viewer_token:
          type: string
        expires_at:
          type: string
          format: date-time
