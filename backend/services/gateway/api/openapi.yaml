  /tracking/session/refresh:
    post:
      operationId: refreshTrackingSession
      summary: Renew a viewer token
      description: 'Takes a viewer token that is still valid and returns a new one, provided the tracking
        link is still valid. The link token is not needed again. Rate limited with `/tracking/session`.
        Problem codes: `viewer_token_invalid` (401, the viewer token is missing, expired, malformed or its
        link was rotated or has expired), `rate_limited` (429), `tracking_unavailable` (503).'
      tags:
      - Tracking
      security:
      - ViewerToken: []
      responses:
        '200':
          description: A new viewer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerTokenRefresh'
              examples:
                default:
                  value:
                    viewer_token: eyJhbGciOiJFZERTQSIsImtpZCI6InYxIn0.eyJhdWQiOiJ2aWV3ZXIifQ.bmV3c2ln
                    expires_at: '2026-10-22T14:50:00Z'
        '401': &id012
          $ref: '#/components/responses/ViewerTokenInvalid'
        '429': *id005
        '503': *id010
  /tracking/snapshot:
    get:
      operationId: getTrackingSnapshot
      summary: Get the current snapshot
      description: 'The current snapshot, for clients that poll instead of streaming. At most 30 requests/minute
        per viewer token. Problem codes: `viewer_token_invalid` (401), `rate_limited` (429), `tracking_unavailable`
        (503).'
      tags:
