                    version: 37
        '404': *id006
        '503': &id010
          $ref: '#/components/responses/TrackingUnavailable'
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/trail:
    parameters:
    - *id007
    get:
      operationId: listDeliveryTrail
      summary: List the courier trail
      description: 'The courier''s accepted fixes for the delivery window (from assignment, or from creation
        in the Direct model, until the delivery is final), oldest first. Raw fixes are kept for 30 days;
        afterwards `raw_available` is `false`, `data` is empty and `simplified` holds the route. With `format=geojson`
        the response is a GeoJSON FeatureCollection (`application/geo+json`) with one LineString and one
        Point per fix. Every read is audited. Requires scope `deliveries:read`. Problem codes: `validation_failed`
        (400), `not_found` (404), `tracking_unavailable` (503).'
      tags:
      - Tracking
      security:
      - SecretKey: []
      parameters:
      - name: format
        in: query
        description: Response format.
        schema:
          type: string
          enum: [json, geojson]
          default: json
      - name: limit
        in: query
        description: Page size.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      - name: starting_after
        in: query
        description: The `next_cursor` of the previous page.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '200':
          description: A page of the trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrailPage'
              examples:
                default:
                  value:
                    data:
                    - t: '2026-10-22T14:15:03Z'
                      lat: -23.5612
                      lng: -46.6557
                      accuracy_m: 6.5
                      speed_mps: 4.8
                      heading_deg: 84
                      source: relay
                    - t: '2026-10-22T14:15:06Z'
                      lat: -23.5611
                      lng: -46.6551
                      accuracy_m: 7
                      speed_mps: null
                      heading_deg: null
                      source: relay
                    has_more: false
                    next_cursor: null
                    raw_available: true
                    simplified: null
                simplified:
                  summary: Raw fixes have been deleted
                  value:
                    data: []
                    has_more: false
                    next_cursor: null
                    raw_available: false
                    simplified:
                    - [-23.5612, -46.6557]
                    - [-23.5530, -46.6410]
                    - [-23.5505, -46.6333]
            application/geo+json:
              schema:
                $ref: '#/components/schemas/TrailGeoJson'
              examples:
                default:
                  value:
                    type: FeatureCollection
                    features:
                    - type: Feature
                      geometry:
                        type: LineString
                        coordinates:
                        - [-46.6557, -23.5612]
                        - [-46.6551, -23.5611]
                      properties:
                        kind: trail
                    - type: Feature
                      geometry:
                        type: Point
                        coordinates: [-46.6557, -23.5612]
                      properties:
                        kind: fix
                        t: '2026-10-22T14:15:03Z'
                        accuracy_m: 6.5
                        speed_mps: 4.8
                        heading_deg: 84
                        source: relay
        '400': *id002
        '404': *id006
        '503': *id010
        '401': *id003
        '403': *id004
        '429': *id005
  /deliveries/{id}/proof-points:
    parameters:
    - *id007
    get:
      operationId: listDeliveryProofPoints
      summary: List the proof points
      description: 'One entry per reported status in which the courier''s position matters (`at_pickup`,
        `pickup_confirmed`, `arriving`, `delivered`, `failed`), with the latest accepted fix from the 2 minutes
        before it, or `position: null` when there was none. Every read is audited. Requires scope `deliveries:read`.
        Problem codes: `not_found` (404), `tracking_unavailable` (503).'
      tags:
      - Tracking
      security:
      - SecretKey: []
      responses:
        '200':
          description: The proof points, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofPointList'
              examples:
                default:
                  value:
                    data:
                    - status: at_pickup
                      at: '2026-10-22T14:12:00Z'
                      actor: courier
                      position:
                        lat: -23.5613
                        lng: -46.6558
                      position_at: '2026-10-22T14:11:57Z'
                      accuracy_m: 5.5
                    - status: delivered
                      at: '2026-10-22T14:40:00Z'
                      actor: courier
                      position: null
                      position_at: null
                      accuracy_m: null
        '404': *id006
        '503': *id010
        '401': *id003
        '403': *id004
        '429': *id005
  /couriers/{id}/locations:
    parameters:
    - name: id
      in: path
      required: true
      description: The courier id (`cou_…`), as returned when you upserted the courier.
      schema:
        $ref: '#/components/schemas/CourierId'
      example: cou_01j9z3k8m2q4r6s8t0v2w4x6y8
    post:
      operationId: reportCourierLocations
      summary: Report courier locations
      description: 'Relays GPS fixes your own courier app collects. A batch holds at most 50 fixes and 16 KB.
        A fix is accepted only while the courier has an assigned delivery that is not final, and it applies
        to each of those deliveries; others are counted as `dropped`, as are fixes that are implausible
        (over 200 km/h, or a jump over 1 km in under 10 s) or dated more than 5 seconds in the future. Fixes
        older than 2 minutes are stored but do not move the live position. Has its own rate limit (1 request/s
        per courier, burst 5; 500 requests/s per tenant). Requires scope `couriers:write`. Problem codes:
        `validation_failed` (400), `not_found` (404, no such courier), `payload_too_large` (413), `rate_limited`
        (429), `tracking_unavailable` (503).'
      tags:
      - Couriers
      security:
      - SecretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCourierLocationsRequest'
            examples:
              default:
                value:
                  fixes:
                  - t: '2026-10-22T14:15:03Z'
                    lat: -23.5612
                    lng: -46.6557
                    accuracy_m: 6.5
                    speed_mps: 4.8
                    heading_deg: 84
                  - t: '2026-10-22T14:15:06Z'
                    lat: -23.5611
                    lng: -46.6551
                    accuracy_m: 7
      responses:
        '200':
          description: How many fixes were accepted and dropped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCourierLocationsResult'
              examples:
                default:
                  value:
                    accepted: 2
                    dropped: 0
        '400': *id002
        '404': *id006
        '413':
          description: The batch is larger than 16 KB (`payload_too_large`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503': *id010
        '401': *id003
        '403': *id004
        '429': *id005
  /test/deliveries/{id}/simulate:
    parameters:
    - *id007
    post:
      operationId: simulateDelivery
      summary: Simulate a delivery
      description: 'Sandbox only. Drives a virtual courier through the delivery: it emits location fixes
        through the same path as the relay and reports the courier''s status events the delivery''s model
        requires. If no courier is assigned, a test courier (`external_id` `dt-simulator`) is created and
        assigned. Runs in the background; follow it with the tracking endpoints. Requires scope `deliveries:write`
        and a test key; a live key gets `403 environment_not_allowed`. Problem codes: `validation_failed`
        (400), `not_found` (404), `simulation_state` (409, the delivery is final or in a state the simulator
        cannot drive), `tracking_unavailable` (503).'
      tags:
      - Sandbox
      security:
      - SecretKey: []
      parameters:
      - *id008
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateDeliveryRequest'
            examples:
              default:
                summary: Defaults
                value: {}
              signal_gap:
                summary: Fast, with a 90 second signal gap
                value:
                  speed_factor: 10
                  signal_gap:
                    after_s: 30
                    duration_s: 90
      responses:
        '202':
          description: The simulation was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStarted'
              examples:
                default:
                  value:
                    simulation_id: sim_01j9z3k8m2q4r6s8t0v2w4x6y8
        '400': *id002
        '404': *id006
        '409':
          description: '`simulation_state`: the delivery is final or in a state the simulator cannot drive.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503': *id010
        '401': *id003
        '403': *id004
        '429': *id005
  /tracking/session:
    post:
      operationId: createTrackingSession
      summary: Start a tracking session
      description: 'Exchanges the tracking link token for a viewer token (valid 15 minutes) and returns the
        current snapshot. No API key is involved; this is called from the customer''s browser or webview.
        Any origin may call it. Rate limited to 10 requests/minute per IP and 30/minute per link. Problem
        codes: `link_invalid` (401, the token is unknown, rotated or expired), `rate_limited` (429), `tracking_unavailable`
        (503).'
      tags:
      - Tracking
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackingSessionRequest'
            examples:
              default:
                value:
                  token: Xk3m9QpL2vN7aB4cD8eF1g
      responses:
        '200':
          description: The viewer token and the current snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingSession'
              examples:
