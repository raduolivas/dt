                      photo_url: null
                      position:
                        lat: -23.5561
                        lng: -46.6492
                      heading_deg: 84
                      speed_kmh: 17.5
                      position_at: '2026-10-22T14:20:03Z'
                      signal: live
                    pickup:
                      location:
                        lat: -23.5614
                        lng: -46.6559
                      name: Pizzaria Central
                    dropoff:
                      location:
                        lat: -23.5505
                        lng: -46.6333
                      label: Apto 42
                    route:
                      to_pickup: null
                      to_dropoff:
                      - [-23.5561, -46.6492]
                      - [-23.5530, -46.6410]
                      - [-23.5505, -46.6333]
                    eta_seconds: 420
                    eta_window: null
                    eta_state: live
                    eta_quality: osrm
                    distance_remaining_m: 1350
                    progress: 0.42
                    timeline:
                    - status: confirmed
                      at: '2026-10-22T14:00:00Z'
                    - status: picked_up
