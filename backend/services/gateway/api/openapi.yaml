                  value:
                    viewer_token: eyJhbGciOiJFZERTQSIsImtpZCI6InYxIn0.eyJhdWQiOiJ2aWV3ZXIifQ.c2lnbmF0dXJl
                    expires_at: '2026-10-22T14:35:00Z'
                    snapshot: &id011
                      delivery_id: del_01j9z3k8m2q4r6s8t0v2w4x6y8
                      delivery_model: direct
                      status: picked_up
                      courier:
                        display_name: Carlos
                        vehicle: e_bike
                        photo_url: null
                        position:
                          lat: -23.5561
                          lng: -46.6492
                        heading_deg: 84
                        speed_kmh: 17.5
                        position_at: '2026-10-22T14:20:03Z'
