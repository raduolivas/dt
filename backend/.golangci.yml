version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - sloglint
  settings:
    depguard:
      rules:
        # Onion rule (spec §8.2): the domain is pure; it knows no I/O.
        domain:
          files:
            - "**/internal/domain/**"
          list-mode: strict
          allow:
            - $gostd
          deny:
            - pkg: net
              desc: "domain layer is standard library only and does no I/O (onion rule, spec §8.2)"
            - pkg: database/sql
              desc: "domain layer is standard library only and does no I/O (onion rule, spec §8.2)"
            - pkg: os/exec
              desc: "domain layer is standard library only and does no I/O (onion rule, spec §8.2)"
        app:
          files:
            - "**/internal/app/**"
          list-mode: lax
          deny:
            - pkg: net/http
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/jackc
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/nats-io
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/redis
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/stripe
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/raduolivas/dt/backend/services/gateway/internal/adapters
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/raduolivas/dt/backend/services/deliveries/internal/adapters
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/raduolivas/dt/backend/services/tracking/internal/adapters
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/raduolivas/dt/backend/services/webhooks/internal/adapters
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
            - pkg: github.com/raduolivas/dt/backend/services/accounts/internal/adapters
              desc: "app layer must depend on ports, not transports or drivers (onion rule, spec §8.2)"
  exclusions:
    generated: strict
    rules:
      # Tests may use fixed dev credentials and plain HTTP to local servers.
      - path: _test\.go
        linters:
          - gosec
          - noctx
