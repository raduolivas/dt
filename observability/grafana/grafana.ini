# Local Grafana (spec §6): anonymous Viewer, no sign-up, no analytics.
[server]
http_port = 3000

[security]
admin_user = admin
admin_password = $__env{GF_SECURITY_ADMIN_PASSWORD}

[users]
allow_sign_up = false
# Anonymous Viewer needs this to open Explore (Mission Control deep links, exemplar and
# derived-field links). Local only; provisioned dashboards stay non-saveable.
viewers_can_edit = true

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[log]
mode = console
