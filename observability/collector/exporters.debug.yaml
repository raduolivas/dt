# Merged on top only when OTELCOL_DEBUG=1 (the Makefile sets OTELCOL_EXTRA_CONFIG).
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      exporters: [otlphttp/mission-control, otlphttp/tempo, debug]
    logs:
      exporters: [otlphttp/mission-control, otlphttp/loki, debug]
    metrics:
      exporters: [otlphttp/prometheus, debug]
