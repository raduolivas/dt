# Queries for the prometheus adapter (spec §4.6, §5.5). Each names a recording
# rule from observability/prometheus/rules/mc-wires.yaml, which returns one
# series per wire with a `wire` label ("<source>><target>", the topology wire
# id) over a fixed 1m window. The rules, not this file, hold the mapping from
# OBS labels to wires; the adapter's window argument does not apply to them.
# Until OBS runs, these return no series, the adapter reports ErrNoData and
# WithFallback uses the builtin source.
rate: mc:wire_requests:rate1m
error_rate: mc:wire_errors:ratio1m
p95_ms: mc:wire_latency_p95_ms:1m
